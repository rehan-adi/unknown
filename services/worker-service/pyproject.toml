[project]

name = "worker-service"
version = "1.0.0"
description = "Background ingestion worker for the Unknown platform"
readme = "README.md"
authors = [
  { name = "Rehan", email = "official.rehan.me@gmail.com" }
]
keywords = ["unknown", "ai", "ingestion", "worker", "rag"]
requires-python = ">=3.11"
dependencies = [
    "aio-pika>=9.5.4",
    "unstructured[pdf]>=0.16.12",
    "qdrant-client>=1.12.2",
    "httpx>=0.28.1",
    "beautifulsoup4>=4.13.3",
    "pydantic>=2.10.6",
    "pydantic-settings>=2.15.0",
    "asyncpg>=0.32.0",
    "boto3>=1.43.110",
    "tenacity>=9.2.1",
    "sentry-sdk>=2.71.0",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = []

[dependency-groups]
dev = [
    "ruff>=0.16.10",
]
