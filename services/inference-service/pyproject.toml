[project]

name = "inference-service"
version = "1.0.0"
description = "Inference API serving local and hosted models for the Unknown platform"
readme = "README.md"
authors = [
  { name = "Rehan", email = "official.rehan.me@gmail.com" }
]
keywords = ["unknown", "ai", "fastapi", "inference", "rag", "inference-service"]
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.142.2",
    "httpx>=0.28.1",
    "langfuse>=4.17.0",
    "pydantic>=2.13.5",
    "pydantic-settings>=2.15.0",
    "sentry-sdk>=2.71.0",
    "uvicorn[standard]>=0.54.0",
]
